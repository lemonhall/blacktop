  <!-- ============================ 四、结算 ============================ -->
  <section id="results" class="screen hidden">
    <div id="confetti" class="confetti" aria-hidden="true"></div>
    <div class="result-card">
      <span id="resultEyebrow" class="result-eyebrow">RACE OVER</span>
      <div id="resultRank" class="result-rank">#0</div>
      <h2 id="resultTitle">比赛结束</h2>
      <p id="resultDescription"></p>
      <div class="result-stats">
        <div><strong id="resultTime">—</strong><span>完赛时间</span></div>
        <div><strong id="resultDowns">0</strong><span>撂倒的人</span></div>
        <div><strong id="resultKills">0</strong><span>踢爆车辆</span></div>
        <div><strong id="resultCrashes">0</strong><span>摔车</span></div>
      </div>
      <div class="result-payout">本场赏金 <strong id="resultPayout">¥0</strong></div>
      <p id="resultRecord" class="result-record"></p>
      <div class="result-head">
        <span>#</span><span>车手</span><span>用时</span><span>撂倒</span><span>踢爆</span><span>赏金</span>
      </div>
      <div id="resultTable" class="result-table"></div>
      <div class="result-actions">
        <button type="button" id="playAgainButton" class="primary-button">再来一局</button>
        <button type="button" id="lobbyButton" class="text-button">回到房间候场</button>
      </div>
    </div>
  </section>
